<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>edit/upload</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="bg-upload">
    <div class="upload-container">
    <h1 id="handbook">ไฟล์คู่มือนักศึกษา</h1> 

    <!-- ฟอร์มอัปโหลดไฟล์ใหม่ — เพิ่มช่อง "ปีการศึกษา" ให้ตรงกับที่ java.js/backend
         (admin_upload ใน main.py) รองรับอยู่แล้ว แต่เดิม HTML ยังไม่มีช่องนี้ให้กรอก -->
    <form id="uploadForm">
        <h3>อัปโหลดไฟล์ใหม่</h3>
        <input type="file" id="fileUpload" accept=".pdf, .txt" required>
        <input type="text" id="fileYear" placeholder="ปีการศึกษา เช่น 66" title="กรอกรหัสรุ่น 2 หลัก เช่น 66 หรือเว้นว่างไว้ถ้าเป็นเอกสารกลางที่ทุกรุ่นเห็น" maxlength="2" inputmode="numeric">
        <input type="submit" value="อัปโหลด">
    </form>

    <!-- ปุ่มเดาปีอัตโนมัติสำหรับไฟล์เก่าที่อัปโหลดไว้ก่อนมีฟีเจอร์แยกปี — เชื่อมกับ
         /admin/files/auto-tag ที่ java.js เขียนไว้รองรับแล้วแต่ยังไม่มีปุ่มให้กด -->
    <div class="auto-tag-bar">
        <button type="button" id="autoTagBtn">🏷️ เดาปีอัตโนมัติสำหรับไฟล์เก่าทั้งหมด</button>
    </div>


    <form id="searchForm">
        <h2 id="listTitle" style="display: inline;">รายการไฟล์คู่มือ</h2> 
        <span></span>  
        <input type="search" name="search_keyword" id="searchInput" placeholder="พิมพ์ชื่อไฟล์เพื่อค้นหา...">
        <input type="submit" value="ค้นหา">
    </form>

    <br>

    <table border="1" 
    width="100%" 
    cellspacing="0" 
    cellpadding="8" 
    style="text-align: center;">
    
        <thead style="background-color: #f2f2f2;">
            <tr>
                <th>ลำดับ</th>
                <th>ชื่อไฟล์</th>
                <th>ปีการศึกษา</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="fileTableBody">
            </tbody>
    </table>
    </div>
<script src="java.js?v=11"></script>
</body>
</html>
